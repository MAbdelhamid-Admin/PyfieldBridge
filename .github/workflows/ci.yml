name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel in an empty project and use both entry points
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv consumer
          . consumer/bin/activate
          pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python - <<'EOF'
          from fieldbridge import convertFrame
          from fieldbridge.wire import parse, serialize

          [rtu] = parse("modbus-rtu", bytes.fromhex("1103006B00037687"))
          result = convertFrame({"source": rtu, "targetProtocol": "modbus-tcp",
                                 "options": {"metadata": {"transactionId": 1}}})
          encoded = serialize(result.frame)
          assert encoded.hex() == "0001000000061103006b0003", encoded.hex()

          from pyfieldbridge import convertFrame as compat
          assert compat is convertFrame
          print("Package smoke test passed")
          EOF
